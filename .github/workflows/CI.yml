# Build native wheels, then exercise the installed artifacts and dependencies.
name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep optimized wheel builds practical on hosted runners with 7 GB RAM.
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
        platform:
          - runner: ubuntu-22.04
            target: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: '1.98.1'
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python${{ matrix.python-version }} --manifest-path ./greyjack/Cargo.toml
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Install built wheel and test dependencies
        shell: bash
        run: python -m pip install --force-reinstall dist/*.whl "polars==1.44.2" pytest
      - name: Test installed wheel outside checkout
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python -I -c 'import os, pathlib, greyjack, polars; assert pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve() not in pathlib.Path(greyjack.__file__).resolve().parents, greyjack.__file__; assert polars.__version__ == "1.44.2"; print(greyjack.__file__, polars.__version__)'
          python -I -m pytest --import-mode=importlib "$GITHUB_WORKSPACE/greyjack/tests"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}-py${{ matrix.python-version }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: '1.98.1'
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python --manifest-path ./greyjack/Cargo.toml
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Install built wheel and test dependencies
        shell: bash
        run: python -m pip install --force-reinstall dist/*.whl "polars==1.44.2" pytest
      - name: Test installed wheel outside checkout
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python -I -c 'import os, pathlib, greyjack, polars; assert pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve() not in pathlib.Path(greyjack.__file__).resolve().parents, greyjack.__file__; assert polars.__version__ == "1.44.2"; print(greyjack.__file__, polars.__version__)'
          python -I -m pytest --import-mode=importlib "$GITHUB_WORKSPACE/greyjack/tests"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-15
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: '1.98.1'
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python --manifest-path ./greyjack/Cargo.toml
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Install built wheel and test dependencies
        shell: bash
        run: python -m pip install --force-reinstall dist/*.whl "polars==1.44.2" pytest
      - name: Test installed wheel outside checkout
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python -I -c 'import os, pathlib, greyjack, polars; assert pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve() not in pathlib.Path(greyjack.__file__).resolve().parents, greyjack.__file__; assert polars.__version__ == "1.44.2"; print(greyjack.__file__, polars.__version__)'
          python -I -m pytest --import-mode=importlib "$GITHUB_WORKSPACE/greyjack/tests"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: '1.98.1'
          command: sdist
          args: --out dist --manifest-path ./greyjack/Cargo.toml
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [linux, windows, macos, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'wheels-*/*'
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            wasm-wheels/*.whl
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
