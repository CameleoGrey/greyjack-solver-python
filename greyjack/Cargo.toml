[package]
name = "greyjack"
version = "0.3.9"
edition = "2021"
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "greyjack"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29.2"
pyo3-polars = "0.28.0"
rand = "0.8.6"
rand_distr = "0.4.3"
ndarray = "0.16.1"
ndarray-rand = "0.15.0"
ndarray-stats = "0.6.0"
chrono = "0.4.39"
polars = { version = "0.55.2", features = ["lazy", "ndarray", "serde", "abs", "dtype-date", "dtype-datetime", "dtype-duration"] }
once_cell = "1.21.3"
rustc-hash = "2.1.1"

# if you build lib from source code
# uncomment to gain max performance (increases calculation speed about ~10%, 
# but also increases build time ~20x times)
#[profile.release]
#lto = true
#codegen-units = 1
#debug = true
#opt-level = 3
